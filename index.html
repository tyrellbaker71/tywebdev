<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TyWebDev | Independent web development</title>
  <meta name="description" content="TyWebDev designs and develops clean, modern websites for businesses that want to stand out online. Email or WhatsApp to start a project.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F1E8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light;

      --cream: #F4F1E8;
      --ink: #191A16;
      --olive: #687447;
      --line: #D5D1C5;
      --muted: #66665D;
      --white: #FFFFFF;

      --font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      --pad-x: clamp(20px, 4.4vw, 64px);
      --pad-y: clamp(20px, 3.6vw, 52px);
      --gap: clamp(12px, 1.6vw, 24px);
      --rule: 2px;

      --h1: clamp(2.6rem, 13vw, 6.5rem);

      box-sizing: border-box;
    }

    *, *::before, *::after { box-sizing: inherit; }

    html {
      background: var(--cream);
      height: 100%;
      -webkit-text-size-adjust: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding:
        calc(var(--pad-y) + env(safe-area-inset-top, 0px))
        var(--pad-x)
        calc(var(--pad-y) + env(safe-area-inset-bottom, 0px));
      overflow-x: clip;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 20px;
      padding-bottom: 14px;
      border-bottom: var(--rule) solid var(--ink);
      margin-bottom: clamp(28px, 7vw, 56px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand::before {
      content: "";
      width: 12px;
      height: 12px;
      background: var(--olive);
      flex: none;
    }

    .descriptor {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    h1 { display: contents; }

    .line {
      display: block;
      font-size: var(--h1);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      margin: 0;
    }

    .line > span { display: block; white-space: nowrap; }
    .l2 { margin-top: 0.06em; }
    .l3 { margin-top: 0.06em; }

    .slab {
      background: var(--olive);
      align-self: flex-end;
      width: 38%;
      height: clamp(22px, 6vw, 40px);
      margin: clamp(22px, 5vw, 36px) calc(var(--pad-x) * -1) clamp(24px, 6vw, 40px) 0;
    }

    .lower {
      margin-top: auto;
      border-top: var(--rule) solid var(--ink);
      padding-top: clamp(20px, 3vw, 28px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .lede {
      margin: 0;
      max-width: 36ch;
      font-size: clamp(1.02rem, 0.96rem + 0.3vw, 1.2rem);
      line-height: 1.55;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 60px;
      padding: 16px 20px;
      border: 2px solid var(--ink);
      border-radius: 0;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.2;
      text-decoration: none;
      transition: background-color 0.1s linear, color 0.1s linear, border-color 0.1s linear;
      -webkit-tap-highlight-color: transparent;
    }

    .btn svg {
      flex: none;
      width: 18px;
      height: 18px;
      transition: transform 0.1s linear;
    }

    .btn--primary { background: var(--ink); color: var(--cream); }
    .btn--secondary { background: var(--cream); color: var(--ink); }

    .btn--primary:hover { background: var(--olive); border-color: var(--olive); color: var(--white); }
    .btn--secondary:hover { background: var(--ink); color: var(--cream); }

    .btn:hover svg { transform: translate(3px, -3px); }

    .btn:focus-visible {
      outline: 3px solid var(--olive);
      outline-offset: 4px;
    }

    .btn--primary:focus-visible { background: var(--olive); border-color: var(--olive); color: var(--white); }
    .btn--secondary:focus-visible { background: var(--ink); color: var(--cream); }

    @media (min-width: 860px) {
      :root { --h1: clamp(5rem, 9vw, 8rem); }

      .page {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: auto auto auto auto 1fr;
        column-gap: var(--gap);
        align-content: stretch;
      }

      .bar { grid-column: 1 / -1; grid-row: 1; }

      .l1 { grid-column: 1 / -1; grid-row: 2; }
      .l1 > span { display: inline; }
      .l2 { grid-column: 1 / 10; grid-row: 3; padding-left: 1em; }
      .l3 { grid-column: 1 / 10; grid-row: 4; }

      .slab {
        grid-column: 10 / -1;
        grid-row: 3 / -1;
        align-self: stretch;
        width: auto;
        height: auto;
        margin: 0.06em calc(var(--pad-x) * -1) calc(var(--pad-y) * -1 - env(safe-area-inset-bottom, 0px)) 0;
      }

      .lower {
        grid-column: 1 / 10;
        grid-row: 5;
        align-self: end;
        margin-top: clamp(40px, 6vw, 80px);
        grid-template-columns: 1fr 1fr;
        column-gap: var(--gap);
        align-items: start;
      }

      .btn { min-height: 64px; padding: 18px 22px; }
    }
    @media (min-width: 1700px) {
      .lede { font-size: 1.3rem; }
    }

    /* Short desktop windows: tighten vertical rhythm */
    @media (min-width: 860px) and (max-height: 760px) {
      .bar { margin-bottom: 20px; }
      .lower { margin-top: 28px; padding-top: 20px; }
      .btn { min-height: 54px; padding-top: 12px; padding-bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .btn svg { transition: none; }
      .btn:hover svg { transform: none; }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="bar" role="presentation">
    </header>

    <h1>
      <span class="line l1"><span>Good</span> <span>websites.</span></span>
      <span class="line l2">Built with</span>
      <span class="line l3">purpose.</span>
    </h1>

    <div class="slab" aria-hidden="true"></div>

    <div class="lower">
      <p class="lede">I design and develop clean, modern websites for businesses that want to stand out online. Have a project in mind? Let's talk.</p>

      <div class="actions">
        <a class="btn btn--primary"
           href="mailto:codingty05@gmail.com?subject=Website%20enquiry">
          <span>Email me</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" focusable="false">
            <path d="M5 15 15 5M7 5h8v8" stroke-linecap="square"/>
          </svg>
        </a>

        <a class="btn btn--secondary"
           href="https://wa.me/27653480014?text=Hi%20TyWebDev!%20I%27d%20like%20to%20enquire%20about%20a%20website."
           target="_blank" rel="noopener noreferrer">
          <span>Let's talk on WhatsApp</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" focusable="false">
            <path d="M5 15 15 5M7 5h8v8" stroke-linecap="square"/>
          </svg>
        </a>
      </div>
    </div>

  </main>
</body>
</html>
